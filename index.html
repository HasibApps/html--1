<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>স্মার্ট GPS নেভিগেশন</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans Bengali",Roboto,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;z-index:1}
.ui{position:absolute;z-index:1000;left:10px;right:10px}
#searchWrap{top:calc(10px + env(safe-area-inset-top,0px))}
#searchBox{display:flex;align-items:center;background:#fff;border-radius:28px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:0 14px}
#searchBox input{flex:1;border:0;outline:0;font-size:16px;padding:14px 8px;background:transparent;color:#202124;min-width:0}
#searchBox button{border:0;background:none;font-size:20px;color:#5f6368;padding:6px}
#results{background:#fff;border-radius:14px;margin-top:6px;box-shadow:0 2px 10px rgba(0,0,0,.3);max-height:45vh;overflow:auto;display:none}
#results div{padding:12px 16px;border-bottom:1px solid #eee;font-size:14px;color:#202124}
#results div:last-child{border:0}
#results div:active{background:#e8f0fe}
#card{top:calc(70px + env(safe-area-inset-top,0px));background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.3);padding:14px;display:none;color:#202124}
.pt{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.pt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modes{display:flex;gap:8px;margin:10px 0}
.mode{flex:1;border:2px solid #dadce0;border-radius:12px;background:#fff;padding:8px;text-align:center;font-size:13px;color:#202124}
.mode b{display:block;font-size:15px}
.mode.on{border-color:#1a73e8;background:#e8f0fe}
.btn{width:100%;border:0;border-radius:24px;background:#1a73e8;color:#fff;font-size:16px;font-weight:600;padding:13px}
.btn.red{background:#d93025}
#navTop{top:calc(10px + env(safe-area-inset-top,0px));background:#0b57d0;color:#fff;border-radius:16px;padding:12px 16px;display:none;box-shadow:0 2px 12px rgba(0,0,0,.4)}
#navTop .row{display:flex;align-items:center;gap:14px}
#arrow{font-size:38px;line-height:1}
#nDist{font-size:24px;font-weight:700}
#nText{font-size:14px;opacity:.95}
#warn{top:calc(100px + env(safe-area-inset-top,0px));background:#d93025;color:#fff;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:700;line-height:1.4;display:none;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.5);animation:bl 1s infinite}
@keyframes bl{50%{background:#a50e0e}}
#navBot{bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:16px;padding:12px 14px;display:none;box-shadow:0 2px 12px rgba(0,0,0,.3);color:#202124;align-items:center;gap:12px}
#navBot .info{flex:1;font-size:15px}#navBot .info b{font-size:18px;color:#188038}
#navBot .btn{width:auto;padding:11px 20px}
#recenter{right:10px;left:auto;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:0;background:#fff;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.35);display:none}
#toast{bottom:calc(30px + env(safe-area-inset-bottom,0px));left:50%;right:auto;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;max-width:90%;text-align:center}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="map"></div>

<div id="searchWrap" class="ui">
  <div id="searchBox"><span>🔍</span><input id="q" placeholder="Search destination…" autocomplete="off"><button id="clr">✕</button></div>
  <div id="results"></div>
</div>

<div id="card" class="ui">
  <div class="pt"><i class="dot" style="background:#1a73e8"></i><span>Your Location</span></div>
  <div class="pt"><i class="dot" style="background:#d93025"></i><span id="destName"></span></div>
  <div class="modes">
    <button class="mode on" data-m="foot">🚶 Walk<b id="tFoot">…</b><small id="dFoot"></small></button>
    <button class="mode" data-m="car">🚗 Car<b id="tCar">…</b><small id="dCar"></small></button>
  </div>
  <button class="btn" id="start">Start Navigation</button>
</div>

<div id="navTop" class="ui"><div class="row"><div id="arrow">↑</div><div><div id="nDist">--</div><div id="nText">…</div></div></div></div>
<div id="warn" class="ui">সতর্কতা! আপনি ঠিক বিপরীত দিকে যাচ্ছেন, আপনি সঠিক দিকে যান।</div>
<div id="navBot" class="ui"><div class="info"><b id="rTime">--</b><br><span id="rDist">--</span></div><button class="btn red" id="stop">Stop</button></div>
<button id="recenter" class="ui" title="Re-center">◎</button>
<div id="toast" class="ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const WARN_TEXT='সতর্কতা! আপনি ঠিক বিপরীত দিকে যাচ্ছেন, আপনি সঠিক দিকে যান।';
const map=L.map('map',{zoomControl:false}).setView([23.8103,90.4125],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

let me=null,dest=null,mode='foot',routes={},route=[],cum=[],steps=[],stepIdx=1,navigating=false,follow=true;
let meMarker,accCircle,destMarker,routeLine,prev=null,lastIdx=-1,lastDNext=null,incCnt=0,oppCnt=0,offCnt=0,lastAlert=0,rerouting=false,wake=null,firstFix=true;

/* ---------- helpers ---------- */
const rad=d=>d*Math.PI/180;
function hav(a,b){const R=6371000,dl=rad(b[0]-a[0]),dn=rad(b[1]-a[1]);
  const x=Math.sin(dl/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function brg(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));
  const x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;}
const adiff=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d;};
const fmtD=m=>m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m';
const fmtT=s=>{const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' m';};
function toast(t,ms=2500){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms);}

function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  const v=speechSynthesis.getVoices();const b=v.find(x=>/^bn/i.test(x.lang))||v.find(x=>/^(hi|as)/i.test(x.lang));
  u.lang=b?b.lang:'bn-BD';if(b)u.voice=b;u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};

/* ---------- live GPS ---------- */
function onPos(pos){
  const c=pos.coords;me={lat:c.latitude,lng:c.longitude,acc:c.accuracy,heading:c.heading,speed:c.speed};
  const ll=[me.lat,me.lng];
  if(!meMarker){meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);
    accCircle=L.circle(ll,{radius:c.accuracy,color:'#1a73e8',weight:1,fillOpacity:.1}).addTo(map);}
  else{meMarker.setLatLng(ll);accCircle.setLatLng(ll).setRadius(c.accuracy);}
  if(firstFix){map.setView(ll,16);firstFix=false;}
  if(navigating){navigate(ll,c);if(follow)map.setView(ll,Math.max(map.getZoom(),17),{animate:true});}
}
function onErr(e){toast(e.code===1?'Location permission denied — please allow GPS':'GPS error: '+e.message,4000);}
if(navigator.geolocation)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:15000});
else toast('Geolocation not supported');

/* ---------- search (Nominatim) ---------- */
let st;
$('q').addEventListener('input',e=>{clearTimeout(st);const v=e.target.value.trim();
  if(v.length<3){$('results').style.display='none';return;}
  st=setTimeout(()=>search(v),600);});
$('clr').onclick=()=>{$('q').value='';$('results').style.display='none';clearRoute();};
async function search(v){
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=bn,en&q='+encodeURIComponent(v));
    const j=await r.json();const box=$('results');box.innerHTML='';
    if(!j.length)box.innerHTML='<div>No results</div>';
    j.forEach(p=>{const d=document.createElement('div');d.textContent='📍 '+p.display_name;
      d.onclick=()=>pick({lat:+p.lat,lng:+p.lon,name:p.display_name});box.appendChild(d);});
    box.style.display='block';
  }catch(e){toast('Search failed — check internet');}
}

/* ---------- routing (OSRM) ---------- */
async function pick(d){
  if(!me){toast('Waiting for your GPS location…',3000);return;}
  dest=d;$('results').style.display='none';$('q').value=d.name.split(',')[0];$('q').blur();
  $('destName').textContent=d.name;
  if(destMarker)destMarker.remove();destMarker=L.marker([d.lat,d.lng]).addTo(map);
  $('tFoot').textContent=$('tCar').textContent='…';$('dFoot').textContent=$('dCar').textContent='';
  $('card').style.display='block';
  await loadRoutes();
}
async function fetchRoute(m,from){
  const p=m==='foot'?'routed-foot':'routed-car';
  const u=`https://routing.openstreetmap.de/${p}/route/v1/driving/${from.lng},${from.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson&steps=true`;
  const r=await fetch(u);const j=await r.json();if(!j.routes||!j.routes[0])throw 0;return j.routes[0];
}
async function loadRoutes(){
  try{
    const [f,c]=await Promise.allSettled([fetchRoute('foot',me),fetchRoute('car',me)]);
    routes={foot:f.value||null,car:c.value||null};
    ['foot','car'].forEach(m=>{const r=routes[m],k=m==='foot'?'Foot':'Car';
      $('t'+k).textContent=r?fmtT(r.duration):'N/A';$('d'+k).textContent=r?fmtD(r.distance):'';});
    if(!routes[mode])mode=routes.foot?'foot':'car';
    setMode(mode);
  }catch(e){toast('Route not found');}
}
function setMode(m){
  mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const r=routes[m];if(!r)return;
  route=r.geometry.coordinates.map(c=>[c[1],c[0]]);
  cum=[0];for(let i=1;i<route.length;i++)cum[i]=cum[i-1]+hav(route[i-1],route[i]);
  steps=[];r.legs.forEach(l=>l.steps.forEach(s=>steps.push({loc:[s.maneuver.location[1],s.maneuver.location[0]],type:s.maneuver.type,mod:s.maneuver.modifier,name:s.name})));
  stepIdx=Math.min(1,steps.length-1);lastIdx=-1;lastDNext=null;incCnt=oppCnt=offCnt=0;
  if(routeLine)routeLine.remove();
  routeLine=L.polyline(route,{color:m==='car'?'#1a73e8':'#188038',weight:6,opacity:.85,dashArray:m==='foot'?'1,10':null,lineCap:'round'}).addTo(map);
  if(!navigating)map.fitBounds(routeLine.getBounds(),{paddingTopLeft:[20,230],paddingBottomRight:[20,20]});
}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function clearRoute(){if(routeLine)routeLine.remove();if(destMarker)destMarker.remove();routeLine=destMarker=null;route=[];dest=null;$('card').style.display='none';}

/* ---------- navigation ---------- */
$('start').onclick=async()=>{
  if(!route.length)return;
  navigating=true;follow=true;prev=null;lastIdx=-1;lastDNext=null;incCnt=oppCnt=offCnt=0;
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(''));}catch(e){}   // unlock speech on user gesture
  try{if(navigator.vibrate)navigator.vibrate(1);}catch(e){}
  try{wake=await navigator.wakeLock.request('screen');}catch(e){}
  $('card').style.display='none';$('searchWrap').style.display='none';
  $('navTop').style.display='block';$('navBot').style.display='flex';
  map.setView([me.lat,me.lng],18);updateStep([me.lat,me.lng]);
};
$('stop').onclick=stopNav;
function stopNav(){
  navigating=false;if(wake){wake.release();wake=null;}
  $('navTop').style.display=$('navBot').style.display=$('warn').style.display=$('recenter').style.display='none';
  $('searchWrap').style.display='block';clearRoute();$('q').value='';speechSynthesis.cancel();
}
map.on('dragstart',()=>{if(navigating){follow=false;$('recenter').style.display='block';}});
$('recenter').onclick=()=>{follow=true;$('recenter').style.display='none';if(me)map.setView([me.lat,me.lng],18);};

function nearest(p){
  let best={d:1e12};const k=Math.cos(rad(p[0]))*111320;
  for(let i=0;i<route.length-1;i++){
    const a=route[i],b=route[i+1];
    const ax=(a[1]-p[1])*k,ay=(a[0]-p[0])*110540,bx=(b[1]-p[1])*k,by=(b[0]-p[0])*110540;
    const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?-(ax*dx+ay*dy)/l:0;t=Math.max(0,Math.min(1,t));
    const px=ax+t*dx,py=ay+t*dy,d=Math.hypot(px,py);
    if(d<best.d)best={d,i,t};
  }
  return best;
}
const ARROW={left:'←',right:'→','slight left':'↖','slight right':'↗','sharp left':'↰','sharp right':'↱',straight:'↑',uturn:'↩'};
const BN={left:'বামে ঘুরুন',right:'ডানে ঘুরুন','slight left':'হালকা বামে যান','slight right':'হালকা ডানে যান','sharp left':'তীব্র বামে ঘুরুন','sharp right':'তীব্র ডানে ঘুরুন',straight:'সোজা যান',uturn:'ইউ-টার্ন নিন'};
function updateStep(p){
  const s=steps[stepIdx];if(!s)return;
  const d=hav(p,s.loc);
  let txt,ar;
  if(s.type==='arrive'){txt='গন্তব্যে পৌঁছাচ্ছেন';ar='🏁';}
  else if(s.type==='roundabout'||s.type==='rotary'){txt='রাউন্ডঅ্যাবাউট ধরুন';ar='⟳';}
  else{txt=(BN[s.mod]||'সোজা যান')+(s.name?' — '+s.name:'');ar=ARROW[s.mod]||'↑';}
  $('arrow').textContent=ar;$('nDist').textContent=fmtD(d);$('nText').textContent=txt;
  if(d<20&&stepIdx<steps.length-1){stepIdx++;}
}
function navigate(p,c){
  const n=nearest(p);if(n.d>1e11)return;
  const seg=cum[n.i+1]-cum[n.i],remain=cum[cum.length-1]-(cum[n.i]+n.t*seg);
  const nextWp=route[n.i+1],dNext=hav(p,nextWp),rBrg=brg(route[n.i],nextWp);
  // distance-to-next-waypoint trend
  if(n.i!==lastIdx){lastIdx=n.i;lastDNext=dNext;incCnt=0;}
  else{if(dNext>lastDNext+2){incCnt++;lastDNext=dNext;}else if(dNext<lastDNext-1){incCnt=0;lastDNext=dNext;}}
  // movement heading
  let mv=null;
  if(prev&&hav(prev,p)>=4){mv=brg(prev,p);prev=p;}
  else if(!prev)prev=p;
  else if(c.heading!=null&&!isNaN(c.heading)&&c.speed>0.8)mv=c.heading;
  if(mv!==null){if(adiff(mv,rBrg)>130)oppCnt++;else oppCnt=0;}
  const goodGps=c.accuracy<=50;
  const wrong=goodGps&&((oppCnt>=2)||(n.d>15&&incCnt>=3));
  showWarn(wrong);
  // off-route reroute (not when wrong-way)
  if(n.d>50&&!wrong){offCnt++;if(offCnt>=5&&!rerouting)reroute();}else offCnt=0;
  updateStep(p);
  $('rDist').textContent=fmtD(remain);
  const sp=mode==='foot'?1.35:9;$('rTime').textContent=fmtT(remain/sp);
  if(remain<15&&steps.length&&stepIdx>=steps.length-1){toast('🏁 আপনি গন্তব্যে পৌঁছেছেন',4000);speak('আপনি গন্তব্যে পৌঁছেছেন');stopNav();}
}
function showWarn(on){
  $('warn').style.display=on?'block':'none';
  if(on&&Date.now()-lastAlert>8000){lastAlert=Date.now();speak(WARN_TEXT);try{navigator.vibrate&&navigator.vibrate([500,200,500,200,500]);}catch(e){}}
  if(!on)oppCnt=Math.min(oppCnt,1);
}
async function reroute(){
  rerouting=true;toast('Re-routing…');
  try{const r=await fetchRoute(mode,me);routes[mode]=r;setMode(mode);}catch(e){}
  rerouting=false;offCnt=0;
}
</script>
</body>
</html>
